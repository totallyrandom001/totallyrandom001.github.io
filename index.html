<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görsel İnceleyici</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
        }

        /* Ana Kapsayıcı */
        .inspector-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Her kenardan %10 boşluk */
            padding: 10vh 10vw;
            overflow: hidden;
        }

        /* Görselin sığdırıldığı sınır alanı */
        .viewport {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: grab;
            touch-action: none;
        }

        .viewport:active {
            cursor: grabbing;
        }

        /* İnceleme Görseli */
        .inspect-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            pointer-events: auto;
            border-radius: 4px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        /* Arayüz Kontrol Paneli */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .zoom-info {
            font-size: 14px;
            font-weight: 600;
            min-width: 60px;
            text-align: center;
        }

        /* Bilgi Kutusu */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
            pointer-events: none;
            text-align: center;
        }

        /* Gizli dosya yükleme girdisi */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <button class="btn" onclick="document.getElementById('file-input').click()">Görsel Yükle</button>
        <button class="btn" id="reset-btn">Sıfırla</button>
        <span class="zoom-info" id="zoom-level">%100</span>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <div class="inspector-container">
        <div class="viewport" id="viewport">
            <img id="inspect-image" class="inspect-image" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80" alt="İncelenen Görsel">
        </div>
    </div>

    <div class="instructions">
        Kaydırmak için basılı tutup sürükleyin &bull; Yakınlaştırmak için tekerleği veya çimdikleme hareketini kullanın
    </div>

    <script>
        const image = document.getElementById('inspect-image');
        const viewport = document.getElementById('viewport');
        const zoomDisplay = document.getElementById('zoom-level');
        const resetBtn = document.getElementById('reset-btn');
        const fileInput = document.getElementById('file-input');

        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        // Dokunmatik cihazlar için (Pinch zoom)
        let initialPinchDistance = null;
        let initialScale = 1;

        function updateTransform() {
            image.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            zoomDisplay.textContent = `%${Math.round(scale * 100)}`;
        }

        function resetView() {
            scale = 1;
            pointX = 0;
            pointY = 0;
            updateTransform();
        }

        // Fare Tekerleği ile Yakınlaştırma
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            
            const delta = -e.deltaY;
            if (delta > 0) {
                scale = Math.min(scale * 1.15, 15); // Maksimum 15x
            } else {
                scale = Math.max(scale / 1.15, 0.8); // Minimum 0.8x
            }

            updateTransform();
        }, { passive: false });

        // Sürükleme Başlangıcı (Fare & Dokunma)
        function startDrag(e) {
            if (e.touches && e.touches.length === 2) {
                // Çimdikleme başlangıcı
                initialPinchDistance = getPinchDistance(e);
                initialScale = scale;
                return;
            }

            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            startX = clientX - pointX;
            startY = clientY - pointY;
        }

        // Sürükleme Hareketi (Fare & Dokunma)
        function moveDrag(e) {
            if (e.touches && e.touches.length === 2) {
                // Çimdikleme hareketi
                if (initialPinchDistance) {
                    const currentDistance = getPinchDistance(e);
                    const factor = currentDistance / initialPinchDistance;
                    scale = Math.min(Math.max(initialScale * factor, 0.8), 15);
                    updateTransform();
                }
                return;
            }

            if (!isDragging) return;
            e.preventDefault();

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            pointX = clientX - startX;
            pointY = clientY - startY;

            updateTransform();
        }

        // Sürükleme Bitişi
        function stopDrag(e) {
            isDragging = false;
            initialPinchDistance = null;
        }

        function getPinchDistance(e) {
            return Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }

        // Fare Etkinlikleri
        viewport.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', stopDrag);

        // Dokunmatik Etkinlikler
        viewport.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', moveDrag, { passive: false });
        window.addEventListener('touchend', stopDrag);

        // Sıfırlama Butonu
        resetBtn.addEventListener('click', resetView);

        // Yeni Görsel Yükleme
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    image.src = evt.target.result;
                    resetView();
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
