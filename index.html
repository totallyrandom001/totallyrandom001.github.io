<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sohbet</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-me: #2b6cff;
    --bubble-other: #23262f;
    --text: #e8e9ec;
    --muted: #8a8f9a;
    --warn-bg: #3a2a12;
    --warn-border: #8a5a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- İsim giriş ekranı --- */
  #nameScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
    text-align: center;
  }
  #nameScreen h1 { margin: 0 0 4px; font-size: 22px; }
  #nameScreen p { color: var(--muted); margin: 0; max-width: 360px; font-size: 14px; }
  #nameInput {
    width: 260px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #333;
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
  }
  #joinBtn {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: var(--bubble-me);
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  /* --- Sohbet ekranı --- */
  #chatScreen { flex: 1; display: none; flex-direction: column; min-height: 0; }
  header {
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid #22252c;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .who { font-weight: 600; }
  header .muted { 
    color: var(--muted); 
    font-size: 12px; 
    cursor: default; 
    text-decoration: none; 
    user-select: none;
  }

  #adminArea {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  #adminControls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
#soundToggle {
  width: 24px;
  height: 24px;
  cursor: pointer;
  user-select: none;
  vertical-align: middle;
}
  #deletePassInput {
    display: none;
    width: 90px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #0f1115;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  #deleteChk {
    display: none;
    cursor: pointer;
    accent-color: var(--bubble-me);
    margin: 0;
  }
  #deleteErrBox {
    display: none;
    color: #ff7a7a;
    font-size: 10px;
  }

  .warning {
    background: var(--warn-bg);
    border-bottom: 1px solid var(--warn-border);
    color: #ffcf8a;
    font-size: 12px;
    padding: 8px 16px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 75%; display: flex; flex-direction: column; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    overflow-wrap: break-word;
  }
  .msg.me .bubble { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .msg.other .bubble { background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin: 3px 6px 0; }
  .bubble img { max-width: 260px; max-height: 260px; border-radius: 10px; display: block; margin-top: 6px; cursor: pointer; }
  .bubble a { color: #4a9eff; text-decoration: underline; cursor: pointer; }
  .msg.me .bubble a { color: #b3d9ff; }
  .imgContainer { position: relative; display: inline-block; margin-top: 6px; }
  .downloadBtn { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; opacity: 0; transition: opacity 0.2s; }
  .imgContainer:hover .downloadBtn { opacity: 1; }

  #composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-top: 1px solid #22252c;
    align-items: flex-end;
  }
  #imgPreviewWrap { display: none; padding: 0 12px 8px; }
  #imgPreviewWrap img { max-height: 80px; border-radius: 8px; display: block; }
  #imgPreviewWrap .removeImg { color: #ff7a7a; font-size: 12px; cursor: pointer; margin-top: 4px; display: inline-block; }

  #textInput {
    flex: 1;
    resize: none;
    max-height: 120px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #0f1115;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    box-sizing: border-box;
    min-height: 40px;
  }
  #attachBtn, #sendBtn {
    border: none;
    background: #262a33;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 15px;
  }
  #sendBtn { background: var(--bubble-me); color: white; }
  #fileInput { display: none; }
  #errBox { color: #ff7a7a; font-size: 12px; padding: 0 12px 8px; display: none; }

  /* --- Loading overlay --- */
  #loadingOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  #loadingOverlay.show {
    display: flex;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top: 4px solid white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loadingText {
    color: white;
    font-size: 14px;
  }

  /* --- Lightbox --- */
  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 1200;
    padding: 10% 10%;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
  }
  #lightbox.show { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    transition: transform 0.05s linear;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
  }
  #lightbox img.zoomed { cursor: grab; }
  #lightbox img.dragging { cursor: grabbing; transition: none; }
  #lightboxControls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 1201;
  }
  #lightboxControls button {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    font-size: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
  }
  #lightboxControls button:hover { background: rgba(255,255,255,0.22); }
  #lightboxClose {
    position: fixed;
    top: 16px;
    left: 16px;
    background: none;
    border: none;
    color: #ff3b3b;
    font-size: 34px;
    line-height: 1;
    cursor: pointer;
    z-index: 1201;
    font-weight: bold;
  }
  .bubble img { cursor: zoom-in; }
</style>
</head>
<body>

  <div id="nameScreen">
    <h1>Sohbete Başla</h1>
    <input id="nameInput" type="text" placeholder="Adınızı girin" maxlength="50" />
    <p>İstediğin adı seç. Bu başkaları tarafından görülebilir.</p>
    <button id="joinBtn">Sohbete Gir</button>
  </div>

  <div id="chatScreen">
    <header>
      <div>
        <div class="who" id="whoLabel"></div>
      </div>
      <div id="adminArea">
        <div id="adminControls">
          <input id="deletePassInput" type="password" placeholder="Şifre" />
          <input id="deleteChk" type="checkbox" />
          <img id="soundToggle" src="soundon.png" alt="Ses" title="Sesi Aç/Kapat" />
          <div class="muted" id="statusLabel">bağlanıyor...</div>
        </div>
        <div id="deleteErrBox"></div>
      </div>
    </header>
    <div class="warning">
      ⚠️ Uyarı: Lütfen sekmeyi kapatmayın.
    </div>
    <div id="messages"></div>
    <div id="imgPreviewWrap">
      <img id="imgPreview" />
      <span class="removeImg" id="removeImgBtn">Görseli kaldır</span>
    </div>
    <div id="errBox"></div>
    <div id="composer">
      <button id="attachBtn" title="Görsel ekle">📎</button>
      <input id="fileInput" type="file" accept="image/*" />
      <textarea id="textInput" rows="1" placeholder="Mesajınızı yazın..."></textarea>
      <button id="sendBtn">Gönder</button>
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loadingText">İşleniyor...</div>
  </div>

  <div id="lightbox">
    <button id="lightboxClose" title="Kapat">✕</button>
    <img id="lightboxImg" src="" />
    <div id="lightboxControls">
      <button id="zoomOutBtn" title="Uzaklaştır">−</button>
      <button id="zoomResetBtn" title="Sıfırla">🔍</button>
      <button id="zoomInBtn" title="Yakınlaştır">+</button>
    </div>
  </div>
<script src="index.js?v=6"></script>
</body>
</html>
