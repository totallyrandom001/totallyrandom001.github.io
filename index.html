<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SOPERT</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-card: #334155;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg-main); color: var(--text-bright); height: 100vh; overflow: hidden; display: flex; }
    .hidden { display: none !important; }
    
    /* Login Screen */
    #auth-view { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-card { background: var(--bg-sidebar); padding: 28px; border-radius: 12px; width: 340px; border: 1px solid #334155; text-align: center; }
    .modal-card input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: var(--bg-main); color: white; }
    .modal-card button { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .modal-card button:hover { background: var(--accent-hover); }
    
    /* Layout */
    #sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .category-header { padding: 12px 16px 6px; font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
    .list-container { flex: 1; overflow-y: auto; padding: 0 8px; margin-bottom: 8px; }
    .list-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; font-size: 14px; position: relative; }
    .list-item:hover { background: var(--bg-card); }
    .list-item.active { background: var(--accent); color: white; }
    
    /* Avatars & Status */
    .avatar-wrap { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: white; }
    .status-badge { position: absolute; bottom: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-sidebar); z-index: 2; }
    .status-badge.online { background-color: var(--success); }
    .status-badge.offline { background-color: #64748b; }
    
    /* Chat Area */
    #workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); position: relative; }
    .header-bar { height: 60px; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 20px; background: var(--bg-sidebar); font-weight: bold; }
    #chat-messages-panel { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    
    .message-row { display: flex; flex-direction: column; max-width: 75%; }
    .message-row.self { align-self: flex-end; align-items: flex-end; }
    .message-row.other { align-self: flex-start; align-items: flex-start; }
    .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .sms-bubble { padding: 10px 14px; font-size: 14px; line-height: 1.4; border-radius: 18px; word-break: break-word; }
    .message-row.self .sms-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .message-row.other .sms-bubble { background: var(--bg-card); color: white; border-bottom-left-radius: 4px; border: 1px solid #475569; }
    .msg-img { max-width: 250px; border-radius: 8px; margin-top: 4px; }
    
    /* Input Area */
    .chat-input-container { padding: 14px 20px; background: var(--bg-sidebar); border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 4px; }
    .typing-indicator { font-size: 12px; color: var(--accent); min-height: 18px; font-style: italic; }
    .input-row { display: flex; gap: 10px; }
    .input-row input { flex: 1; background: var(--bg-main); border: 1px solid #334155; padding: 12px; border-radius: 8px; color: white; outline: none; }
    .input-row button { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .input-row button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <div id="auth-view">
    <div class="modal-card">
      <h2 style="margin-bottom: 20px;">SOPERT Giriş</h2>
      <input type="text" id="username" placeholder="Kullanıcı Adı" onkeydown="if(event.key==='Enter') doLogin()">
      <input type="password" id="password" placeholder="Şifre" onkeydown="if(event.key==='Enter') doLogin()">
      <button onclick="doLogin()">Giriş Yap</button>
      <div id="auth-error" style="color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px;"></div>
    </div>
  </div>

  <div id="sidebar" class="hidden">
    <div style="padding: 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #334155;">
      <div class="avatar-wrap" id="my-avatar-wrap">
        <div class="avatar-img" id="my-avatar-initial"></div>
      </div>
      <div id="my-username" style="font-weight: bold;"></div>
      <button onclick="logout()" style="margin-left: auto; background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;">Çıkış</button>
    </div>
    <div class="category-header">Arkadaşlar</div>
    <div class="list-container" id="friends-list"></div>
    <div class="category-header">Gruplar</div>
    <div class="list-container" id="groups-list"></div>
  </div>

  <div id="workspace" class="hidden">
    <div class="header-bar" id="chat-header">Bir sohbet seçin</div>
    <div id="chat-messages-panel"></div>
    
    <div class="chat-input-container">
      <div id="typing-indicator" class="typing-indicator"></div>
      <div class="input-row">
        <input type="text" id="message-input" placeholder="Bir mesaj yazın..." oninput="handleInputKeydown()" onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
      </div>
    </div>
  </div>

  <script>
    const RELAY = "https://your-relay.onrender.com"; // Adjust to your backend URL
    const WS_RELAY = RELAY.replace("https://", "wss://").replace("http://", "ws://");

    // ==========================================
    // 1. GLOBAL FETCH INTERCEPTOR (MAINTENANCE FIX)
    // ==========================================
    function triggerMaintenance() {
      document.body.innerHTML = `
        <div style="background-color: black; color: red; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 24px; font-weight: bold; padding: 20px; box-sizing: border-box;">
          SOPERT ŞU ANDA BAKIM ALTINDA YA DA ÇALIŞMAMAKTADIR, LÜTFEN DAHA SONRA TEKRAR DENEYİNİZ.
        </div>
      `;
      // Automatic 3-second refresh cycle
      setInterval(() => location.reload(), 3000);
      window.stop();
    }

    const _origFetch = window.fetch;
    window.fetch = async (...args) => {
      try {
        const res = await _origFetch(...args);
        
        // Catch standard offline status codes
        if (res.status === 502 || res.status === 503 || res.status === 999) {
          triggerMaintenance();
          return res;
        }

        // Catch specific text error ("Vaio Bağlantısı Başarısız" / "Veritabanı...")
        const clone = res.clone();
        const text = await clone.text();
        if (text.includes("Vaio Bağlantısı Başarısız") || text.includes("Veritabanı Bağlantısı Başarısız")) {
          triggerMaintenance();
          return res; // Halt processing
        }

        // Standard 998 Token Expiration
        if (res.status === 998 || text.includes("Oturum süresi doldu") || text.includes("998")) {
            forceLocalLogout();
        }

        return res;
      } catch (err) {
        if (err.message && (err.message.includes("Vaio Bağlantısı Başarısız") || err.message.includes("Veritabanı"))) {
          triggerMaintenance();
        }
        throw err;
      }
    };

    // ==========================================
    // 2. STATE & API WRAPPER
    // ==========================================
    let sessionToken = localStorage.getItem("token") || "";
    let myUsername = localStorage.getItem("username") || "";
    
    let activeGroupToken = null;
    let localFriends = [];
    let localGroups = [];
    let onlineMap = {}; // Maps username -> boolean online status

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json" };
      if (sessionToken) headers["Authorization"] = sessionToken;
      
      const res = await fetch(`${RELAY}${path}`, {
        ...options,
        headers: { ...headers, ...options.headers },
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // ==========================================
    // 3. WS STREAM (CLIENT -> SERVER)
    // ==========================================
    let ws = null;
    let wsReady = false;
    let wsBackoff = 1000;
    let wsReconnTimer = null;
    let wsDestroyed = false;
    let intendedOnline = true;

    function wsConnect() {
      if (wsDestroyed) return;
      ws = new WebSocket(`${WS_RELAY}/api/client-stream`);

      ws.onopen = () => {
        // Send I-FRAME Auth
        wsSend({
          frameType: "I-FRAME",
          token: sessionToken,
          state: { presence: intendedOnline ? "online" : "offline" }
        });
      };

      ws.onmessage = (event) => {
        try {
          const frame = JSON.parse(event.data);
          if (frame.frameType === "I-FRAME-ACK" && frame.ok) {
            wsReady = true;
            wsBackoff = 1000;
            console.log("[ws] Authenticated");
          }
        } catch (e) {}
      };

      ws.onclose = (event) => {
        wsReady = false;
        if (event.code === 4002) {
          console.error("[ws] Session rejected. Logging out.");
          forceLocalLogout();
          return;
        }
        if (!wsDestroyed) scheduleWsReconnect();
      };
    }

    function wsSend(frame) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(frame));
        return true;
      }
      return false;
    }

    function scheduleWsReconnect() {
      clearTimeout(wsReconnTimer);
      wsReconnTimer = setTimeout(() => {
        wsBackoff = Math.min(wsBackoff * 2, 30000);
        wsConnect();
      }, wsBackoff);
    }

    function setPresence(online) {
      intendedOnline = online;
      wsSend({ frameType: "P-FRAME", type: "PRESENCE", payload: { online } });
    }

    function teardownWS() {
      wsDestroyed = true;
      clearTimeout(wsReconnTimer);
      if (ws) {
        wsSend({ frameType: "P-FRAME", type: "PRESENCE", payload: { online: false } });
        ws.close(1000, "logout");
        ws = null;
      }
      wsReady = false;
    }

    // Visibility mapping
    document.addEventListener("visibilitychange", () => setPresence(document.visibilityState === "visible"));
    window.addEventListener("focus", () => setPresence(true));
    window.addEventListener("blur", () => {
      if (document.visibilityState === "hidden") setPresence(false);
    });

    // ==========================================
    // 4. SSE STREAM (SERVER -> CLIENT)
    // ==========================================
    let sse = null;

    async function openSSE() {
      try {
        const { streamToken } = await api("/api/stream/token", { method: "POST" });
        sse = new EventSource(`${RELAY}/api/stream?token=${streamToken}`);

        sse.onmessage = (event) => {
          try {
            const frame = JSON.parse(event.data);
            handleServerFrame(frame);
          } catch (e) {}
        };

        sse.onerror = () => {
          console.warn("[sse] Connection error — browser will retry automatically.");
        };
      } catch (err) {
        console.error("Failed to open SSE:", err);
      }
    }

    function handleServerFrame(frame) {
      if (frame.frameType === "I-FRAME") {
        applySnapshot(frame);
        return;
      }
      if (frame.frameType !== "P-FRAME") return;

      switch (frame.type) {
        case "PRESENCE_CHANGED":
          onlineMap[frame.payload.username] = frame.payload.online;
          updatePresenceIndicators();
          break;
        case "FRIEND_ACCEPTED":
          if (frame.payload.friendRowFor[myUsername]) {
            localFriends.push(frame.payload.friendRowFor[myUsername]);
            renderSidebar();
          }
          break;
        case "FRIEND_REMOVED":
          localFriends = localFriends.filter(f => !(f.user1 === frame.payload.user1 && f.user2 === frame.payload.user2));
          if (activeGroupToken && activeGroupToken.startsWith("dm_")) {
              const other = frame.payload.user1 === myUsername ? frame.payload.user2 : frame.payload.user1;
              if (activeGroupToken.includes(other)) document.getElementById("chat-messages-panel").innerHTML = "<em>Arkadaşlıktan çıkarıldı.</em>";
          }
          renderSidebar();
          break;
        case "GROUP_MEMBER_ADDED":
          if (frame.payload.newMember.username === myUsername) {
            localGroups.push(frame.payload.group);
            renderSidebar();
          }
          break;
        case "GROUP_MEMBER_LEFT":
          if (frame.payload.username === myUsername) {
            localGroups = localGroups.filter(g => g.group_token !== frame.payload.groupToken);
            if (activeGroupToken === frame.payload.groupToken) {
              activeGroupToken = null;
              document.getElementById("chat-messages-panel").innerHTML = "";
              document.getElementById("chat-header").innerText = "Bir sohbet seçin";
            }
            renderSidebar();
          }
          break;
        case "NEW_MESSAGE":
          if (frame.payload.group_token === activeGroupToken) {
            renderSingleMessage(frame.payload);
          }
          break;
        case "MESSAGE_DELETED":
          if (frame.payload.groupToken === activeGroupToken) {
            const el = document.getElementById(`msg-${frame.payload.messageId}`);
            if (el) el.remove();
          }
          break;
        case "TYPING":
          if (frame.payload.groupToken === activeGroupToken && frame.payload.username !== myUsername) {
            handleIncomingTyping(frame.payload.username, frame.payload.isTyping);
          }
          break;
        case "USER_PFP_UPDATED":
          // Refresh avatars locally
          renderSidebar();
          break;
      }
    }

    function applySnapshot(frame) {
      if (frame.user?.pfp) document.getElementById("my-avatar-initial").innerHTML = `<img src="${frame.user.pfp}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      else document.getElementById("my-avatar-initial").innerText = myUsername[0].toUpperCase();

      localFriends = frame.friends || [];
      localGroups = frame.groups || [];
      
      // Seed Online Map
      onlineMap = {};
      localFriends.forEach(f => {
        const other = f.user1 === myUsername ? f.user2 : f.user1;
        onlineMap[other] = f.online;
      });
      localGroups.forEach(g => {
        (g.members || []).forEach(m => onlineMap[m.username] = m.online);
      });

      renderSidebar();
    }

    // ==========================================
    // 5. UI RENDERING
    // ==========================================
    function renderSidebar() {
      const fList = document.getElementById("friends-list");
      fList.innerHTML = "";
      localFriends.filter(f => f.status === "accepted").forEach(f => {
        const otherUser = f.user1 === myUsername ? f.user2 : f.user1;
        const dmToken = "dm_" + [f.user1, f.user2].sort().join("_");
        fList.appendChild(createListItem(otherUser, dmToken, f.pfp, true));
      });

      const gList = document.getElementById("groups-list");
      gList.innerHTML = "";
      localGroups.forEach(g => {
        gList.appendChild(createListItem(g.group_name, g.group_token, null, false));
      });
      
      updatePresenceIndicators();
    }

    function createListItem(name, token, pfp, isUser) {
      const div = document.createElement("div");
      div.className = `list-item ${activeGroupToken === token ? 'active' : ''}`;
      div.onclick = () => openChat(token, name, isUser);

      if (isUser) {
        const wrap = document.createElement("div");
        wrap.className = "avatar-wrap";
        const img = document.createElement("div");
        img.className = "avatar-img";
        if (pfp) img.innerHTML = `<img src="${pfp}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        else img.innerText = name[0].toUpperCase();
        
        const badge = document.createElement("div");
        badge.className = "status-badge";
        badge.setAttribute("data-user", name);
        
        wrap.appendChild(img);
        wrap.appendChild(badge);
        div.appendChild(wrap);
      }
      
      const span = document.createElement("span");
      span.innerText = isUser ? `@${name}` : `# ${name}`;
      div.appendChild(span);
      
      return div;
    }

    function updatePresenceIndicators() {
      document.querySelectorAll(".status-badge").forEach(badge => {
        const user = badge.getAttribute("data-user");
        if (user) {
          const isOnline = !!onlineMap[user];
          badge.classList.toggle("online", isOnline);
          badge.classList.toggle("offline", !isOnline);
        }
      });
    }

    // ==========================================
    // 6. CHAT LOGIC & TYPING
    // ==========================================
    async function openChat(token, name, isDM) {
      activeGroupToken = token;
      document.getElementById("chat-header").innerText = isDM ? `@${name}` : `# ${name}`;
      
      document.querySelectorAll(".list-item").forEach(el => el.classList.remove("active"));
      event.currentTarget.classList.add("active");

      const panel = document.getElementById("chat-messages-panel");
      panel.innerHTML = "<div style='color:var(--text-muted);text-align:center;'>Yükleniyor...</div>";
      
      // Clear typing states
      currentTypers.clear();
      renderTypingText();

      try {
        // If DM is unopened server-side, this validates/creates it
        if (isDM && token.startsWith("dm_")) {
           await api("/api/dm/open", { method: "POST", body: JSON.stringify({ targetUsername: name }) });
        }
        const msgs = await api(`/api/messages/${token}?limit=50`);
        panel.innerHTML = "";
        msgs.forEach(msg => renderSingleMessage(msg));
        panel.scrollTop = panel.scrollHeight;
      } catch (err) {
        panel.innerHTML = "<div style='color:var(--danger);text-align:center;'>Mesajlar yüklenemedi.</div>";
      }
    }

    async function renderSingleMessage(msg) {
      const panel = document.getElementById("chat-messages-panel");
      const isSelf = msg.sender === myUsername;
      
      const row = document.createElement("div");
      row.className = `message-row ${isSelf ? 'self' : 'other'}`;
      row.id = `msg-${msg.id}`;

      if (!isSelf) {
        const sender = document.createElement("div");
        sender.className = "msg-sender";
        sender.innerText = `@${msg.sender}`;
        row.appendChild(sender);
      }

      const bubble = document.createElement("div");
      bubble.className = "sms-bubble";

      // HTML text comes pre-escaped from server, so innerHTML is safe here
      if (msg.content && msg.content.startsWith("img:")) {
        const imgId = msg.content.slice(4);
        bubble.innerText = "Yükleniyor...";
        api(`/api/images/${imgId}`).then(res => {
          bubble.innerHTML = `<img src="${res.content}" class="msg-img">`;
          panel.scrollTop = panel.scrollHeight;
        }).catch(() => bubble.innerText = "Görsel yüklenemedi");
      } else {
        bubble.textContent = msg.content; // Use textContent for safety fallback
      }

      row.appendChild(bubble);
      panel.appendChild(row);
      panel.scrollTop = panel.scrollHeight;
    }

    // TYPING SENDER (WS)
    const typingState = {}; 

    function handleInputKeydown() {
      if (!activeGroupToken) return;
      const state = typingState[activeGroupToken] || (typingState[activeGroupToken] = {});

      if (!state.isTyping) {
        state.isTyping = true;
        sendTypingWS(activeGroupToken, true);
      }

      clearTimeout(state.timer);
      state.timer = setTimeout(() => {
        state.isTyping = false;
        sendTypingWS(activeGroupToken, false);
      }, 3000);
    }

    function handleInputSendOrBlur() {
      if (!activeGroupToken) return;
      const state = typingState[activeGroupToken];
      if (!state) return;
      clearTimeout(state.timer);
      if (state.isTyping) {
        state.isTyping = false;
        sendTypingWS(activeGroupToken, false);
      }
    }

    function sendTypingWS(groupToken, isTyping) {
      wsSend({
        frameType: "P-FRAME",
        type: "TYPING",
        payload: { groupToken, isTyping }
      });
    }

    // TYPING RECEIVER (SSE)
    const currentTypers = new Set();
    const typingUIResetTimers = {};

    function handleIncomingTyping(username, isTyping) {
      clearTimeout(typingUIResetTimers[username]);

      if (isTyping) {
        currentTypers.add(username);
        // Safety timeout in case isTyping:false is dropped
        typingUIResetTimers[username] = setTimeout(() => {
          currentTypers.delete(username);
          renderTypingText();
        }, 7000);
      } else {
        currentTypers.delete(username);
      }
      renderTypingText();
    }

    function renderTypingText() {
      const ind = document.getElementById("typing-indicator");
      if (currentTypers.size === 0) ind.innerText = "";
      else if (currentTypers.size === 1) ind.innerText = `${Array.from(currentTypers)[0]} yazıyor...`;
      else if (currentTypers.size === 2) ind.innerText = `${Array.from(currentTypers).join(" ve ")} yazıyor...`;
      else ind.innerText = `${currentTypers.size} kişi yazıyor...`;
    }

    async function sendMessage() {
      const input = document.getElementById("message-input");
      const content = input.value.trim();
      if (!content || !activeGroupToken) return;

      handleInputSendOrBlur(); // Clear typing status immediately
      input.value = "";

      try {
        await api("/api/messages/send", {
          method: "POST",
          body: JSON.stringify({ groupToken: activeGroupToken, content })
        });
      } catch (err) {
        console.error("Failed to send:", err);
      }
    }

    // ==========================================
    // 7. AUTHENTICATION & BOOTSTRAP
    // ==========================================
    async function doLogin() {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;
      const err = document.getElementById("auth-error");
      
      if (!u || !p) { err.innerText = "Eksik bilgi"; return; }
      
      try {
        const res = await fetch(`${RELAY}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || "Giriş başarısız");
        
        localStorage.setItem("token", data.token);
        localStorage.setItem("username", data.username);
        location.reload(); // Reload to bootstrap cleanly
      } catch (e) {
        err.innerText = e.message;
      }
    }

    function forceLocalLogout() {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      location.reload();
    }

    async function logout() {
      try { await api("/api/logout", { method: "POST" }); } catch {}
      teardownWS();
      if (sse) { sse.close(); sse = null; }
      forceLocalLogout();
    }

    // Bootstrap
    window.onload = async () => {
      if (sessionToken) {
        document.getElementById("auth-view").classList.add("hidden");
        document.getElementById("sidebar").classList.remove("hidden");
        document.getElementById("workspace").classList.remove("hidden");
        document.getElementById("my-username").innerText = myUsername;

        wsConnect();
        await openSSE();
      }
    };
  </script>
</body>
</html>
