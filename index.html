<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Chat Platform</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-card: #334155;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg-main); color: var(--text-bright); height: 100vh; overflow: hidden; }
    .hidden { display: none !important; }

    #app-container { display: flex; width: 100vw; height: 100vh; }

    /* Single Sidebar */
    .sidebar { width: 300px; background: var(--bg-sidebar); border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .user-profile-card { padding: 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    .avatar-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; border: 2px solid var(--accent); }

    .nav-btn { width: 100%; padding: 12px 16px; background: transparent; color: var(--text-bright); border: none; text-align: left; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #334155; }
    .nav-btn:hover, .nav-btn.active { background: var(--bg-card); color: var(--accent-hover); }

    .category-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px; font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
    .add-btn-icon { background: var(--accent); color: white; border: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
    .add-btn-icon:hover { background: var(--accent-hover); }

    .list-container { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
    .list-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; transition: 0.2s; }
    .list-item:hover { background: var(--bg-card); }
    .list-item.active { background: var(--accent); }

    /* Workspace */
    .workspace { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .header-bar { height: 60px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--bg-sidebar); }

    .content-panel { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    /* Message Cards */
    .message-group { background: var(--bg-sidebar); border-radius: 12px; padding: 12px 16px; border: 1px solid #334155; display: flex; flex-direction: column; max-width: 80%; width: fit-content; }
    .message-group.self { align-self: flex-end; background: #134e4a; border-color: #0d9488; }
    .group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    .group-header .sender-name { font-weight: bold; font-size: 14px; color: var(--accent-hover); }
    .message-group.self .group-header .sender-name { color: #5eead4; }
    .group-lines { display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
    .group-timestamp { font-size: 11px; color: var(--text-muted); align-self: flex-end; margin-top: 6px; }

    /* Chat Input Bar */
    .chat-input-container { padding: 16px 24px; background: var(--bg-sidebar); border-top: 1px solid #334155; display: flex; gap: 12px; }
    .chat-input-container input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; color: white; outline: none; }
    
    input[type="text"], input[type="password"] { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; color: white; width: 100%; margin-bottom: 12px; }
    button { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button.danger { background: var(--danger); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; z-index: 100; align-items: center; justify-content: center; }
    .modal-card { background: var(--bg-sidebar); padding: 32px; border-radius: 12px; width: 440px; border: 1px solid #334155; }
  </style>
</head>
<body>

  <audio id="notify-audio" src="notify.mp3" preload="auto"></audio>

  <div id="auth-view" class="modal-overlay">
    <div class="modal-card">
      <h2 style="margin-bottom: 16px; text-align: center;">Aura Chat</h2>
      <input type="text" id="username" placeholder="Username (letters only)">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()" style="width: 100%; margin-bottom: 8px;">Log In</button>
      <button onclick="register()" style="width: 100%; background: var(--success);">Request Account Creation</button>
      <p id="auth-msg" style="margin-top: 12px; font-size: 13px; color: var(--danger); text-align: center;"></p>
    </div>
  </div>

  <div id="app-container" class="hidden">
    
    <div class="sidebar">
      <div class="user-profile-card">
        <div id="user-avatar-container"></div>
        <div style="flex:1;">
          <div id="user-display-name" style="font-weight: bold;"></div>
          <div id="user-role-tag" style="font-size: 11px; color: var(--text-muted);"></div>
        </div>
        <button onclick="toggleSettings(true)" style="padding: 6px 10px;">⚙️</button>
      </div>

      <button class="nav-btn active" id="btn-friends-tab" onclick="showFriendsView()">👥 Friends</button>

      <div class="category-header">
        <span>Groups</span>
        <button class="add-btn-icon" title="Create Group" onclick="toggleCreateGroupModal(true)">+</button>
      </div>

      <div class="list-container" id="groups-nav-list"></div>
    </div>

    <div class="workspace">
      <div class="header-bar">
        <h3 id="active-title">Friends Dashboard</h3>
        <div id="header-actions"></div>
      </div>

      <div id="friends-panel" class="content-panel">
        <div style="background: var(--bg-sidebar); padding: 16px; border-radius: 8px; border: 1px solid #334155;">
          <h4>Add Friend</h4>
          <div style="display: flex; gap: 8px; margin-top: 8px;">
            <input type="text" id="friend-target-input" placeholder="Enter username" style="margin: 0;">
            <button onclick="sendFriendRequest()">Send Request</button>
          </div>
        </div>

        <div style="background: var(--bg-sidebar); padding: 16px; border-radius: 8px; border: 1px solid #334155;">
          <h4>Pending Requests</h4>
          <div id="pending-friends-list" style="margin-top: 8px;"></div>
        </div>

        <div style="background: var(--bg-sidebar); padding: 16px; border-radius: 8px; border: 1px solid #334155;">
          <h4>Accepted Friends</h4>
          <div id="accepted-friends-list" style="margin-top: 8px; display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <p id="friends-status-msg" style="color: var(--accent-hover); font-size: 14px;"></p>
      </div>

      <div id="chat-messages-panel" class="content-panel hidden"></div>

      <div id="chat-input-area" class="chat-input-container hidden">
        <input type="text" id="message-input" placeholder="Type a message..." onkeydown="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <div id="create-group-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Create New Group</h3>
      <input type="text" id="modal-group-name" placeholder="Group Name" style="margin-top: 16px;">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button onclick="toggleCreateGroupModal(false)" style="background: var(--bg-card);">Cancel</button>
        <button onclick="createGroupFromModal()">Create Group</button>
      </div>
    </div>
  </div>

  <div id="add-member-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Add User to Group</h3>
      <input type="text" id="modal-member-username" placeholder="Username to add" style="margin-top: 16px;">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
        <button onclick="toggleAddMemberModal(false)" style="background: var(--bg-card);">Cancel</button>
        <button onclick="submitAddMember()">Add User</button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card" style="width: 500px;">
      <h3>User Settings</h3>
      <hr style="border-color: #334155; margin: 12px 0;">

      <h4>Upload Profile Picture (Auto Compress &le; 512KB)</h4>
      <input type="file" id="pfp-file-input" accept="image/*" style="margin: 12px 0;">
      <button onclick="processAndUploadPFP()" style="margin-bottom: 16px;">Upload Photo</button>

      <h4>Notification Gain</h4>
      <p style="font-size: 12px; color: #f0b232; margin: 4px 0 8px;">⚠️ Volume changes lock for 24 hours after applying.</p>
      <input type="range" id="volume-db-slider" min="-30" max="12" value="0" step="1" oninput="document.getElementById('db-val').innerText=this.value">
      <span id="db-val">0</span> dB
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button onclick="previewAudio()">Preview</button>
        <button id="apply-vol-btn" onclick="applyVolumeLock()" style="background: var(--success);">Apply (Lock 24h)</button>
      </div>
      <p id="lock-msg" style="color: var(--danger); font-size: 12px; margin-top: 4px;"></p>

      <div id="admin-section" class="hidden" style="margin-top: 20px; border-top: 1px solid #334155; padding-top: 12px;">
        <h4 style="color: var(--danger);">Admin Controls</h4>
        <div id="admin-pending-accounts" style="margin: 8px 0;"></div>
        <input type="text" id="delete-username-input" placeholder="Target Username to Delete">
        <button class="danger" onclick="adminDeleteUser()">Delete Account</button>
      </div>

      <div style="display: flex; justify-content: space-between; margin-top: 24px;">
        <button class="danger" onclick="logout()">Logout</button>
        <button onclick="toggleSettings(false)">Close</button>
      </div>
    </div>
  </div>

  <script>
    const BACKEND = "https://sevrercde.onrender.com";
    let token = localStorage.getItem("token") || "";
    let currentUser = localStorage.getItem("username") || "";
    let currentRole = localStorage.getItem("role") || "";
    let currentUserPfp = localStorage.getItem("pfp") || "";
    let activeGroupToken = "";
    let eventSource = null;
    let audioCtx, gainNode;

    // --- PFP Upload & Compression ---
    function processAndUploadPFP() {
      const fileInput = document.getElementById("pfp-file-input");
      if (!fileInput.files.length) return alert("Select an image file!");

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width, height = img.height;
          const maxDim = 300;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }

          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.85;
          let base64 = canvas.toDataURL("image/jpeg", quality);

          while (base64.length > 512 * 1024 && quality > 0.1) {
            quality -= 0.1;
            base64 = canvas.toDataURL("image/jpeg", quality);
          }

          if (base64.length > 512 * 1024) return alert("Image exceeds size limit.");
          uploadPFP(base64);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    async function uploadPFP(base64) {
      const res = await fetch(`${BACKEND}/api/user/pfp`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ pfpBase64: base64 })
      });
      if (res.ok) {
        currentUserPfp = base64;
        localStorage.setItem("pfp", base64);
        renderUserAvatar(currentUser, base64);
        alert("Profile picture updated!");
      } else {
        const data = await res.json();
        alert(data.error);
      }
    }

    function renderUserAvatar(username, pfpUrl, containerId = "user-avatar-container") {
      const container = document.getElementById(containerId);
      if (pfpUrl) {
        container.innerHTML = `<img src="${pfpUrl}" class="avatar-img">`;
      } else {
        container.innerHTML = `<div class="avatar-img">${username[0].toUpperCase()}</div>`;
      }
    }

    // --- Audio System ---
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioCtx.createGain();
        const audioEl = document.getElementById("notify-audio");
        const src = audioCtx.createMediaElementSource(audioEl);
        src.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      }
      setGain(parseFloat(localStorage.getItem("sound_db") || "0"));
    }

    function setGain(db) {
      if (!gainNode) return;
      gainNode.gain.setValueAtTime(Math.pow(10, db / 20), audioCtx.currentTime);
    }

    function playNotification() {
      if (!document.hasFocus()) {
        const audio = document.getElementById("notify-audio");
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
    }

    function applyVolumeLock() {
      const db = parseFloat(document.getElementById("volume-db-slider").value);
      localStorage.setItem("sound_db", db);
      localStorage.setItem("vol_lock", Date.now() + (24 * 60 * 60 * 1000));
      setGain(db);
      checkLockStatus();
    }

    function checkLockStatus() {
      const lock = localStorage.getItem("vol_lock");
      const slider = document.getElementById("volume-db-slider");
      const btn = document.getElementById("apply-vol-btn");
      if (lock && Date.now() < parseInt(lock)) {
        slider.disabled = true; btn.disabled = true;
        const remaining = ((parseInt(lock) - Date.now()) / (1000 * 60 * 60)).toFixed(1);
        document.getElementById("lock-msg").innerText = `Locked for ${remaining} more hours.`;
      } else {
        slider.disabled = false; btn.disabled = false;
        document.getElementById("lock-msg").innerText = "";
      }
    }

    function previewAudio() {
      initAudio();
      setGain(parseFloat(document.getElementById("volume-db-slider").value));
      const audio = document.getElementById("notify-audio");
      audio.currentTime = 0; audio.play();
    }

    // --- Authentication ---
    async function login() {
      let u = document.getElementById("username").value.toLowerCase().replace(/[^a-z]/g, "");
      let p = document.getElementById("password").value;
      const res = await fetch(`${BACKEND}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token; currentUser = data.username; currentRole = data.role; currentUserPfp = data.pfp || "";
        localStorage.setItem("token", token);
        localStorage.setItem("username", currentUser);
        localStorage.setItem("role", currentRole);
        localStorage.setItem("pfp", currentUserPfp);
        location.reload();
      } else {
        document.getElementById("auth-msg").innerText = data.error;
      }
    }

    async function register() {
      let u = document.getElementById("username").value.toLowerCase().replace(/[^a-z]/g, "");
      let p = document.getElementById("password").value;
      const res = await fetch(`${BACKEND}/api/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      document.getElementById("auth-msg").innerText = data.message || data.error;
    }

    function logout() {
      if (eventSource) eventSource.close();
      localStorage.clear();
      location.reload();
    }

    // --- Stream Engine ---
    function startStream() {
      eventSource = new EventSource(`${BACKEND}/api/stream?token=${token}`);
      eventSource.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.frameType === "I-FRAME") {
          renderFriends(data.friends);
          renderGroups(data.groups);
        } else if (data.frameType === "P-FRAME") {
          if (data.type === "NEW_MESSAGE") {
            if (data.payload.group_token === activeGroupToken) {
              loadMessages(activeGroupToken);
            }
            if (data.payload.sender !== currentUser) playNotification();
          } else if (data.type.startsWith("FRIEND_") || data.type.startsWith("GROUP_")) {
            location.reload();
          }
        }
      };
    }

    function renderFriends(friends) {
      const pendingList = document.getElementById("pending-friends-list");
      const acceptedList = document.getElementById("accepted-friends-list");
      pendingList.innerHTML = ""; acceptedList.innerHTML = "";

      friends.forEach(f => {
        const otherUser = f.user1 === currentUser ? f.user2 : f.user1;
        if (f.status === "accepted") {
          const item = document.createElement("div");
          item.className = "list-item";
          item.style.background = "var(--bg-sidebar)";
          item.innerHTML = `
            <div style="width: 32px; height: 32px;">${f.pfp ? `<img src="${f.pfp}" class="avatar-img" style="width:32px;height:32px;">` : `<div class="avatar-img" style="width:32px;height:32px;font-size:12px;">${otherUser[0].toUpperCase()}</div>`}</div>
            <span>@${otherUser}</span>
            <button onclick="openDM('${otherUser}')" style="margin-left: auto; padding: 4px 10px; font-size: 12px;">Message</button>
          `;
          acceptedList.appendChild(item);
        } else if (f.status === "pending" && f.user2 === currentUser) {
          const pItem = document.createElement("div");
          pItem.style.margin = "4px 0";
          pItem.innerHTML = `@${f.user1} <button onclick="acceptFriend('${f.user1}')" style="padding:4px 8px; font-size:12px;">Accept</button>`;
          pendingList.appendChild(pItem);
        }
      });
    }

    function renderGroups(groups) {
      const list = document.getElementById("groups-nav-list");
      list.innerHTML = "";
      groups.forEach(g => {
        if (g.group_name.startsWith("@")) return;
        const item = document.createElement("div");
        item.className = `list-item ${g.group_token === activeGroupToken ? 'active' : ''}`;
        item.innerText = `# ${g.group_name}`;
        item.onclick = () => selectGroup(g.group_token, g.group_name);
        list.appendChild(item);
      });
    }

    // --- Message Grouping ---
    async function loadMessages(groupToken) {
      const res = await fetch(`${BACKEND}/api/messages/${groupToken}`, { headers: { "Authorization": token } });
      const msgs = await res.json();
      const container = document.getElementById("chat-messages-panel");
      container.innerHTML = "";

      let currentGroup = null;

      msgs.forEach(msg => {
        const isSelf = msg.sender === currentUser;
        const msgTime = msg.created_at;

        if (
          currentGroup &&
          currentGroup.sender === msg.sender &&
          (msgTime - currentGroup.lastTimestamp) <= (5 * 60 * 1000)
        ) {
          const line = document.createElement("div");
          line.innerText = msg.content;
          currentGroup.linesElement.appendChild(line);
          currentGroup.lastTimestamp = msgTime;
          currentGroup.timeElement.innerText = new Date(msgTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else {
          const groupCard = document.createElement("div");
          groupCard.className = `message-group ${isSelf ? 'self' : ''}`;

          const header = document.createElement("div");
          header.className = "group-header";
          header.innerHTML = `
            <div style="width:24px;height:24px;">
              ${msg.pfp ? `<img src="${msg.pfp}" class="avatar-img" style="width:24px;height:24px;">` : `<div class="avatar-img" style="width:24px;height:24px;font-size:11px;">${msg.sender[0].toUpperCase()}</div>`}
            </div>
            <span class="sender-name">${msg.sender}</span>
          `;

          const linesContainer = document.createElement("div");
          linesContainer.className = "group-lines";
          const firstLine = document.createElement("div");
          firstLine.innerText = msg.content;
          linesContainer.appendChild(firstLine);

          const timeStamp = document.createElement("div");
          timeStamp.className = "group-timestamp";
          timeStamp.innerText = new Date(msgTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          groupCard.appendChild(header);
          groupCard.appendChild(linesContainer);
          groupCard.appendChild(timeStamp);
          container.appendChild(groupCard);

          currentGroup = {
            sender: msg.sender,
            lastTimestamp: msgTime,
            linesElement: linesContainer,
            timeElement: timeStamp
          };
        }
      });
      container.scrollTop = container.scrollHeight;
    }

    // Dynamic Navigation
    function showFriendsView() {
      activeGroupToken = "";
      document.getElementById("btn-friends-tab").classList.add("active");
      document.getElementById("active-title").innerText = "Friends Dashboard";
      document.getElementById("header-actions").innerHTML = "";
      document.getElementById("friends-panel").classList.remove("hidden");
      document.getElementById("chat-messages-panel").classList.add("hidden");
      document.getElementById("chat-input-area").classList.add("hidden");

      // Deactivate all group items in sidebar
      document.querySelectorAll("#groups-nav-list .list-item").forEach(el => el.classList.remove("active"));
    }

    async function selectGroup(groupToken, name) {
      activeGroupToken = groupToken;
      document.getElementById("btn-friends-tab").classList.remove("active");
      document.getElementById("active-title").innerText = name;
      
      // Add member button directly into group header bar if not a private DM
      if (!name.startsWith("@")) {
        document.getElementById("header-actions").innerHTML = `<button onclick="toggleAddMemberModal(true)">+ Add Member</button>`;
      } else {
        document.getElementById("header-actions").innerHTML = "";
      }

      document.getElementById("friends-panel").classList.add("hidden");
      document.getElementById("chat-messages-panel").classList.remove("hidden");
      document.getElementById("chat-input-area").classList.remove("hidden");
      loadMessages(groupToken);
    }

    async function openDM(targetUser) {
      const res = await fetch(`${BACKEND}/api/dm/open`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ targetUsername: targetUser })
      });
      const data = await res.json();
      if (res.ok) selectGroup(data.groupToken, `@${targetUser}`);
      else alert(data.error);
    }

    async function sendFriendRequest() {
      const target = document.getElementById("friend-target-input").value;
      const res = await fetch(`${BACKEND}/api/friends/request`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ targetUsername: target })
      });
      const data = await res.json();
      document.getElementById("friends-status-msg").innerText = data.message || data.error;
    }

    async function acceptFriend(target) {
      await fetch(`${BACKEND}/api/friends/accept`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ targetUsername: target })
      });
      location.reload();
    }

    // Modals
    function toggleCreateGroupModal(show) { document.getElementById("create-group-modal").classList.toggle("hidden", !show); }
    function toggleAddMemberModal(show) { document.getElementById("add-member-modal").classList.toggle("hidden", !show); }
    function toggleSettings(show) {
      document.getElementById("settings-modal").classList.toggle("hidden", !show);
      if (show) {
        checkLockStatus();
        if (currentRole === "admin") {
          document.getElementById("admin-section").classList.remove("hidden");
          loadAdminPending();
        }
      }
    }

    async function createGroupFromModal() {
      const groupName = document.getElementById("modal-group-name").value;
      if (!groupName) return alert("Enter a group name!");
      const res = await fetch(`${BACKEND}/api/groups/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ groupName })
      });
      if (res.ok) {
        toggleCreateGroupModal(false);
        document.getElementById("modal-group-name").value = "";
      } else {
        const data = await res.json();
        alert(data.error);
      }
    }

    async function submitAddMember() {
      if (!activeGroupToken) return alert("No active group selected!");
      const targetUsername = document.getElementById("modal-member-username").value;
      const res = await fetch(`${BACKEND}/api/groups/add-member`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ groupToken: activeGroupToken, targetUsername })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.ok) {
        toggleAddMemberModal(false);
        document.getElementById("modal-member-username").value = "";
      }
    }

    async function sendMessage() {
      const input = document.getElementById("message-input");
      if (!input.value.trim() || !activeGroupToken) return;
      const content = input.value;
      input.value = "";
      await fetch(`${BACKEND}/api/messages/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ groupToken: activeGroupToken, content })
      });
    }

    function handleKeyPress(e) { if (e.key === "Enter") sendMessage(); }

    async function loadAdminPending() {
      const res = await fetch(`${BACKEND}/api/admin/pending`, { headers: { "Authorization": token } });
      const pending = await res.json();
      const list = document.getElementById("admin-pending-accounts");
      list.innerHTML = "";
      pending.forEach(p => {
        const item = document.createElement("div");
        item.style.margin = "4px 0";
        item.innerHTML = `${p.username} <button onclick="adminAction(${p.id}, 'approve')">Approve</button> <button class="danger" onclick="adminAction(${p.id}, 'deny')">Deny</button>`;
        list.appendChild(item);
      });
    }

    async function adminAction(id, action) {
      await fetch(`${BACKEND}/api/admin/action`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ id, action })
      });
      loadAdminPending();
    }

    async function adminDeleteUser() {
      const username = document.getElementById("delete-username-input").value;
      await fetch(`${BACKEND}/api/admin/delete-user`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": token },
        body: JSON.stringify({ username })
      });
      alert(`Deleted ${username}`);
    }

    window.onload = () => {
      if (token) {
        document.getElementById("auth-view").classList.add("hidden");
        document.getElementById("app-container").classList.remove("hidden");
        document.getElementById("user-display-name").innerText = currentUser;
        document.getElementById("user-role-tag").innerText = currentRole;
        renderUserAvatar(currentUser, currentUserPfp);
        initAudio();
        startStream();
      }
    };
  </script>
</body>
</html>
